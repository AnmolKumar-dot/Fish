<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d35"><title>S.K TRADERS — Business Manager</title>
<style>
:root{--navy:#101d35;--navy2:#192b49;--gold:#c9a85b;--bg:#f3f5f8;--ink:#182338;--muted:#718096;--line:#e4e9f0;--white:#fff;--green:#16845b;--red:#c64b4b;--shadow:0 8px 28px #10203b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{background:linear-gradient(120deg,var(--navy),#213657);color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 4px 18px #0b193333}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border:1px solid #c9a85b88;border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:17px}.brand h1{font-size:17px;margin:0;letter-spacing:1.2px}.brand small{color:#bdc8d9}.topright{display:flex;gap:8px;align-items:center}.pill{border:1px solid #ffffff35;border-radius:20px;padding:7px 11px;color:#e9edf4;font-size:12px}.layout{display:grid;grid-template-columns:225px 1fr;max-width:1600px;margin:auto}.side{padding:20px 12px;position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;margin:3px 0;border-radius:10px;color:#526176;display:flex;gap:12px;align-items:center;font-weight:600}.navbtn:hover,.navbtn.active{background:#e8edf5;color:var(--navy)}.navbtn.active{box-shadow:inset 3px 0 var(--gold)}.navbtn span:first-child{width:20px;text-align:center}.main{padding:25px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.pagehead h2{font-size:23px;margin:0;color:var(--navy)}.sub{color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:9px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--navy);color:white;border-color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#17243a}.btn.danger{color:var(--red);border-color:#efcccc}.btn.sm{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:16px}.stat .label{color:var(--muted);font-size:12px;font-weight:650}.stat .value{font-size:23px;font-weight:800;color:var(--navy);margin-top:7px;letter-spacing:-.5px}.stat .hint{font-size:11px;color:var(--muted);margin-top:4px}.panel{padding:18px;margin-bottom:16px}.panel h3{margin:0 0 14px;color:var(--navy);font-size:15px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:16px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:#fafbfd}td{font-size:13px}td.num,th.num{text-align:right}.empty{text-align:center;color:var(--muted);padding:30px}.badge{border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700;background:#edf2f7;color:#536174}.badge.good{background:#e5f5ee;color:var(--green)}.badge.warn{background:#fff3df;color:#9a6813}.badge.bad{background:#fceaea;color:var(--red)}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#536174}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ec;border-radius:8px;padding:10px 11px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c9a85b22}.formbar{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.inline{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.inline .field{flex:1;min-width:130px}.notice{background:#fff8e8;border:1px solid #f1dfb7;padding:12px;border-radius:10px;color:#755a22;font-size:12px;margin-bottom:15px}.muted{color:var(--muted)}.money{font-variant-numeric:tabular-nums}.hide{display:none!important}.itemrow{display:grid;grid-template-columns:2fr .7fr .9fr .9fr auto;gap:8px;align-items:end;margin-bottom:8px}.itemrow input,.itemrow select{min-width:0;width:100%;padding:9px;border:1px solid var(--line);border-radius:7px}.totalbox{margin-left:auto;max-width:360px}.totalrow{display:flex;justify-content:space-between;padding:6px 0}.totalrow.big{border-top:1px solid var(--line);font-weight:850;font-size:18px;color:var(--navy);margin-top:5px;padding-top:12px}.mobilebar{display:none}.modalback{position:fixed;inset:0;background:#0b172b88;z-index:20;display:grid;place-items:center;padding:15px}.modal{background:white;border-radius:15px;width:min(760px,100%);max-height:92vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h3{margin:0}.close{border:0;background:#eef1f5;border-radius:8px;padding:7px 10px}.footnote{font-size:11px;color:var(--muted);margin-top:18px}.quick{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:260px}.search input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px}.reportcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.reportcards .stat{box-shadow:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14243d;color:white;padding:11px 16px;border-radius:9px;z-index:50;box-shadow:var(--shadow)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.side{display:none}.main{padding:16px 13px 85px}.top{padding:13px 15px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px #10203b10}.mobilebar button{border:0;background:transparent;color:#68778b;font-size:10px;display:grid;justify-items:center;gap:2px;padding:4px}.mobilebar button.active{color:var(--navy);font-weight:800}.mobilebar b{font-size:17px}.split{grid-template-columns:1fr}.topright .pill{display:none}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px}.stat .value{font-size:19px}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.itemrow{grid-template-columns:1.5fr .7fr .8fr .8fr auto;gap:4px}.itemrow input,.itemrow select{padding:7px;font-size:12px}.panel{padding:13px}.reportcards{grid-template-columns:1fr 1fr}}
@media print{body{background:white}.top,.side,.mobilebar,.pagehead,.no-print{display:none!important}.layout{display:block}.main{padding:0}.panel,.stat{box-shadow:none;border:0}.print-area{display:block!important}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="mark">SK</div><div><h1 id="brandName">S.K TRADERS</h1><small id="brandSub">Plant Site, Dhaga Gali, Rourkela, Odisha</small></div></div><div class="topright"><span class="pill">WHOLESALE BUSINESS MANAGER</span><button class="btn sm" onclick="navigate('settings')">⚙ Settings</button></div></header>
<div class="layout"><aside class="side" id="sideNav"></aside><main class="main" id="main"></main></div><nav class="mobilebar" id="mobileNav"></nav></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='sktraders_business_manager_v1';
const defaults={business:{name:'S.K TRADERS',address:'Plant Site, Dhaga Gali, Rourkela, Odisha',phone:'9437129612',whatsapp:'9937608901',prefix:'SKT'},products:[],customers:[],suppliers:[],invoices:[],purchases:[],expenses:[],payments:[],adjustments:[],settings:{lowStock:5,nextInvoice:1}};
let db=load();let page='dashboard';let searchText='';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...structuredClone(defaults),...x,business:{...defaults.business,...x.business},settings:{...defaults.settings,...x.settings}}:structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return '₹'+(Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dateISO(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){if(!s)return '—';let [y,m,d]=s.slice(0,10).split('-');return `${d}-${m}-${y}`}
function monthNow(){return dateISO().slice(0,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sum(a,fn){return a.reduce((t,x)=>t+(fn?Number(fn(x)||0):Number(x)||0),0)}
function toast(s){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2600)}
const nav=[['dashboard','▦','Dashboard'],['billing','▤','Billing'],['products','▣','Products & Stock'],['purchases','⇧','Purchases'],['customers','♙','Customers'],['expenses','₹','Expenses'],['reports','▥','Reports'],['settings','⚙','Settings']];
function navHTML(mobile=false){return nav.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${mobile?`<b>${ic}</b><span>${label.split(' ')[0]}</span>`:`<span>${ic}</span>${label}`}</button>`).join('')}
function navigate(p){page=p;searchText='';render()}
function header(title,sub,buttons=''){return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">${sub||''}</div></div><div class="actions">${buttons}</div></div>`}
function stat(label,value,hint=''){return `<div class="stat"><div class="label">${label}</div><div class="value money">${value}</div><div class="hint">${hint}</div></div>`}
function table(headers,rows,empty='No records yet'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}
function render(){document.getElementById('sideNav').innerHTML=navHTML();document.getElementById('mobileNav').innerHTML=navHTML(true);document.getElementById('brandName').textContent=db.business.name;document.getElementById('brandSub').textContent=db.business.address;let el=document.getElementById('main');({dashboard:dash,billing:billing,products:products,purchases:purchases,customers:customers,expenses:expenses,reports:reports,settings:settings}[page]||dash)(el)}
function dash(el){let today=dateISO(),mo=monthNow(),sales=db.invoices.filter(x=>x.date===today),ms=db.invoices.filter(x=>x.date?.startsWith(mo)),purch=db.purchases.filter(x=>x.date===today),mp=db.purchases.filter(x=>x.date?.startsWith(mo));let outstanding=sum(db.invoices,x=>x.balance);let tx=[...db.invoices.map(x=>({...x,type:'Sale',ref:x.number,amount:x.total})),...db.purchases.map(x=>({...x,type:'Purchase',ref:x.number,amount:x.total}))].sort((a,b)=>(b.created||b.date).localeCompare(a.created||a.date)).slice(0,8);
el.innerHTML=header('Dashboard','Business overview · '+fmtDate(today),`<button class="btn primary" onclick="navigate('billing')">＋ New Bill</button><button class="btn" onclick="navigate('purchases')">＋ Purchase</button>`)+
`<div class="grid">${stat("Today's Sales",money(sum(sales,x=>x.total)),sales.length+' invoices')}${stat('Monthly Sales',money(sum(ms,x=>x.total)),ms.length+' invoices this month')}${stat("Today's Purchases",money(sum(purch,x=>x.total)),purch.length+' entries')}${stat('Monthly Purchases',money(sum(mp,x=>x.total)),mp.length+' entries')}${stat('Total Customers',db.customers.length,'Saved customer accounts')}${stat('Total Products',db.products.length,'Product catalogue')}${stat('Total Stock Quantity',sum(db.products,x=>x.stock),'Across all products')}${stat('Customer Outstanding',money(outstanding),'Unpaid invoice balances')}${stat('Total Invoices',db.invoices.length,'All billing records')}${stat('Low Stock Items',db.products.filter(x=>Number(x.stock)<=Number(db.settings.lowStock)).length,'At or below alert level')}</div>
<div class="split"><section class="panel"><h3>Recent Transactions</h3>${table(['Date','Type','Reference','Party','Amount'],tx.map(x=>`<tr><td>${fmtDate(x.date)}</td><td><span class="badge ${x.type==='Sale'?'good':''}">${x.type}</span></td><td>${esc(x.ref)}</td><td>${esc(x.customer||x.supplier||'—')}</td><td class="num money">${money(x.amount)}</td></tr>`).join(''))}</section><section class="panel"><h3>Low Stock Alerts</h3>${table(['Product','Stock','Alert'],db.products.filter(x=>Number(x.stock)<=Number(db.settings.lowStock)).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stock}</td><td><span class="badge warn">Restock</span></td></tr>`).join(''),'All products are above the low-stock threshold.')}</section></div>`;
}
function billing(el){el.innerHTML=header('Billing','Create and manage GST, Non-GST and NIL invoices',`<button class="btn primary" onclick="newInvoice()">＋ Create Invoice</button>`)+`<section class="panel"><div class="inline"><div class="field"><label>Search invoices</label><input id="q" placeholder="Invoice, customer or phone" oninput="filterTable()"></div><div class="field"><label>Invoice type</label><select id="billFilter" onchange="filterTable()"><option value="">All types</option><option>GST</option><option>Non-GST</option><option>NIL</option></select></div></div><div id="invoiceTable">${invoiceTable(db.invoices)}</div></section>`}
function invoiceTable(list){return table(['Invoice','Date','Customer','Type','Total','Paid','Balance','Actions'],list.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td><b>${esc(x.number)}</b></td><td>${fmtDate(x.date)}</td><td>${esc(x.customer||'Walk-in')}<br><small class="muted">${esc(x.phone||'')}</small></td><td><span class="badge">${x.type}</span></td><td class="num">${money(x.total)}</td><td class="num">${money(x.paid)}</td><td class="num">${money(x.balance)}</td><td><button class="btn sm" onclick="viewInvoice('${x.id}')">View / Print</button> <button class="btn sm danger" onclick="deleteRecord('invoices','${x.id}')">Delete</button></td></tr>`).join(''))}
function filterTable(){let q=(document.getElementById('q')?.value||'').toLowerCase(),f=document.getElementById('billFilter')?.value||'';let a=db.invoices.filter(x=>(!f||x.type===f)&&[x.number,x.customer,x.phone].join(' ').toLowerCase().includes(q));document.getElementById('invoiceTable').innerHTML=invoiceTable(a)}
function products(el){el.innerHTML=header('Products & Stock','Manage catalogue, pricing and inventory',`<button class="btn primary" onclick="productForm()">＋ Add Product</button>`)+`<section class="panel"><div class="inline"><div class="field"><label>Search products</label><input id="prodq" placeholder="Product name or category" oninput="productFilter()"></div><div class="field"><label>Stock status</label><select id="stockf" onchange="productFilter()"><option value="">All stock</option><option value="low">Low stock</option><option value="ok">In stock</option></select></div></div><div id="productTable">${productTable(db.products)}</div></section>`}
function productTable(a){return table(['Product','Category','Purchase Price','Selling Price','Stock','Actions'],a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.category||'—')}</td><td class="num">${money(x.cost)}</td><td class="num">${money(x.price)}</td><td><span class="badge ${Number(x.stock)<=Number(db.settings.lowStock)?'warn':'good'}">${x.stock}</span></td><td><button class="btn sm" onclick="productForm('${x.id}')">Edit</button> <button class="btn sm" onclick="adjustStock('${x.id}')">Adjust</button> <button class="btn sm danger" onclick="deleteRecord('products','${x.id}')">Delete</button></td></tr>`).join(''))}
function productFilter(){let q=document.getElementById('prodq').value.toLowerCase(),f=document.getElementById('stockf').value;let a=db.products.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q)&&(f==='low'?Number(x.stock)<=Number(db.settings.lowStock):f==='ok'?Number(x.stock)>Number(db.settings.lowStock):true));document.getElementById('productTable').innerHTML=productTable(a)}
function purchases(el){el.innerHTML=header('Purchases','Supplier purchases and stock-in records',`<button class="btn primary" onclick="newPurchase()">＋ Add Purchase</button>`)+`<section class="panel">${table(['Purchase No.','Date','Supplier','Total','Paid','Payable','Actions'],db.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.number)}</td><td>${fmtDate(x.date)}</td><td>${esc(x.supplier)}</td><td class="num">${money(x.total)}</td><td class="num">${money(x.paid)}</td><td class="num">${money(x.balance)}</td><td><button class="btn sm" onclick="viewPurchase('${x.id}')">View</button> <button class="btn sm danger" onclick="deleteRecord('purchases','${x.id}')">Delete</button></td></tr>`).join(''))}</section>`}
function customers(el){el.innerHTML=header('Customers','Customer accounts, sales history and ledger',`<button class="btn primary" onclick="customerForm()">＋ Add Customer</button>`)+`<section class="panel"><div class="field"><label>Search customers</label><input id="custq" placeholder="Name or phone" oninput="customerFilter()"></div><div id="customerTable">${customerTable(db.customers)}</div></section>`}
function customerTable(a){return table(['Customer','Phone','Address','Sales','Paid','Outstanding','Actions'],a.map(c=>{let inv=db.invoices.filter(x=>x.customerId===c.id),total=sum(inv,x=>x.total),paid=sum(inv,x=>x.paid),bal=sum(inv,x=>x.balance);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.address||'—')}</td><td>${money(total)}</td><td>${money(paid)}</td><td>${money(bal)}</td><td><button class="btn sm" onclick="ledger('${c.id}')">Ledger</button> <button class="btn sm" onclick="customerForm('${c.id}')">Edit</button> <button class="btn sm danger" onclick="deleteRecord('customers','${c.id}')">Delete</button></td></tr>`}).join(''))}
function customerFilter(){let q=document.getElementById('custq').value.toLowerCase();document.getElementById('customerTable').innerHTML=customerTable(db.customers.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q)))}
function expenses(el){el.innerHTML=header('Expenses','Record day-to-day operating expenses',`<button class="btn primary" onclick="expenseForm()">＋ Add Expense</button>`)+`<section class="panel"><div class="reportcards">${stat('Today',money(sum(db.expenses.filter(x=>x.date===dateISO()),x=>x.amount)))}${stat('This Month',money(sum(db.expenses.filter(x=>x.date?.startsWith(monthNow())),x=>x.amount)))}${stat('All Expenses',money(sum(db.expenses,x=>x.amount)))}</div><br>${table(['Date','Category','Description','Amount','Actions'],db.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.description)}</td><td class="num">${money(x.amount)}</td><td><button class="btn sm" onclick="expenseForm('${x.id}')">Edit</button> <button class="btn sm danger" onclick="deleteRecord('expenses','${x.id}')">Delete</button></td></tr>`).join(''))}</section>`}
function reports(el){let sales=db.invoices,buys=db.purchases,exp=db.expenses;let gross=sum(sales,x=>x.total),purchase=sum(buys,x=>x.total),paid=sum(sales,x=>x.paid),profit=sum(sales,x=>x.items.reduce((t,i)=>t+(Number(i.rate)-Number(i
